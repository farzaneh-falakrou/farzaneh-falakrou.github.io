    const slot=182;
    (function place(v,depth,xa){ shown++; maxDepth=Math.max(maxDepth,depth); v.depth=depth; v.cx=xa; v.w=boxW(v,fs);
      if(v.children.length){ let pi=v.children.findIndex(c=>c.on); if(pi<0) pi=(v.children.length-1)/2;
        v.children.forEach((c,i)=>place(c,depth+1, xa+(i-pi)*slot)); }
    })(view,0,0);
  }
  let minX=Infinity,maxX=-Infinity;
  (function b(v){ minX=Math.min(minX,v.cx-v.w/2); maxX=Math.max(maxX,v.cx+v.w/2); v.children.forEach(b); })(view);
  const off = mx - minX;
  const W=(maxX-minX)+mx*2, H=my*2+maxDepth*yGap+BH;
  const X=v=>v.cx+off, Y=v=>my+v.depth*yGap+BH/2;
  const svg=svel("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  if(full) svg.setAttribute("class","full");
  const defs=svel("defs",{});
  defs.innerHTML=`<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>`;
  svg.appendChild(defs);
  (function edges(v){ const py=Y(v)+BH/2; for(const c of v.children){ const cy=Y(c)-BH/2; const onEdge=c.on;
    svg.appendChild(svel("line",{x1:X(v),y1:py,x2:X(c),y2:cy,
      stroke: onEdge?"var(--accent)":"var(--sibline)","stroke-width": onEdge?2:1.2,
      "marker-end": onEdge?"url(#ar)":""}));
    edges(c); } })(view);
  (function boxes(v){ const cx=X(v), cy=Y(v), c=cls(v);
    const stroke = c==="path"||c==="sel"?"var(--pathline)": c==="dino"?"var(--dino)":"var(--sibline)";
    const fill = c==="path"||c==="sel"?"var(--pathfill)": c==="dino"?"var(--dinofill)":"var(--sibfill)";
    svg.appendChild(svel("rect",{x:cx-v.w/2,y:cy-BH/2,width:v.w,height:BH,rx:6,
      fill, stroke, "stroke-width": c==="sel"?2.4:1.5}));
    const t=svel("text",{x:cx,y:cy+fs*0.35,"text-anchor":"middle"}); t.setAttribute("class","bx "+c); t.textContent=v.name;
    svg.appendChild(t);
    v.children.forEach(boxes);
  })(view);
  panel.innerHTML=""; panel.appendChild(svg);

  elCount.innerHTML=`showing <b>${shown}</b> of ${TOTAL} nodes`;
  const leaf=byId[leafId], par=leaf.parent, cladeSibs=[...par.kids.values()].filter(c=>!c.genus);
  let msg = full
    ? "<b>Full tree</b> — every dinosaur's lineage, top to bottom, all at once."
    : "<b>Pruned</b> — the selected lineage is drawn in teal with its sibling groups beside each step; branches off the path aren't expanded.";
  if(cladeSibs.length) msg += `  Note: <b>${leaf.name}</b> is recorded only to <b>${par.name}</b>, so it sits <i>beside</i> the group ${cladeSibs.map(c=>c.name).join(", ")} — not inside it.`;
  elFoot.innerHTML=msg;
}

const sel=document.getElementById("dino");
[...DINOS].sort((a,b)=>a.n.localeCompare(b.n)).forEach(d=>{const o=document.createElement("option");o.value=d.n;o.textContent=d.n;sel.appendChild(o);});
sel.value=focus; sel.onchange=()=>{ focus=sel.value; render(); };
const bFull=document.getElementById("mFull"), bPrune=document.getElementById("mPrune");
function setMode(m){ mode=m; bFull.setAttribute("aria-pressed",m==="full"); bPrune.setAttribute("aria-pressed",m==="prune"); render(); }
bFull.onclick=()=>setMode("full"); bPrune.onclick=()=>setMode("prune");
render();
</script>
