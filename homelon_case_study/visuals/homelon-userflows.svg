<svg width="1520" height="1120" viewBox="0 0 1520 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B9B4A8"/>
  </marker>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"/>
  </marker>
  <style>
    text{font-family:'Inter',-apple-system,system-ui,sans-serif;}
    .n{font-size:14px;font-weight:700;fill:#1a1a1a;}
    .s{font-size:12px;font-weight:600;fill:#1a1a1a;}
    .task{font-size:12.5px;font-weight:600;fill:#ff5a36;}
  </style>
</defs>

  <!-- ===== FLOW 4: ONBOARDING & PREFERENCES ===== -->
  <text class="task" x="372" y="42">Flow 4 · Onboarding &amp; set preferences</text>

  <circle cx="80" cy="110" r="38" fill="#2E7D5E"/>
  <text class="n" fill="#fff" text-anchor="middle" x="80" y="115">Start</text>

  <rect x="150" y="82" width="150" height="56" rx="10" fill="#fff" stroke="#CCCCCC" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="225" y="115">Landing page</text>

  <rect x="380" y="55" width="150" height="50" rx="10" fill="#C8E6C9" stroke="#8FAE90" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="455" y="85">Sign In</text>
  <rect x="380" y="140" width="150" height="50" rx="10" fill="#C8E6C9" stroke="#8FAE90" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="455" y="170">Sign Up</text>

  <rect x="620" y="139" width="170" height="56" rx="10" fill="#fff" stroke="#CCCCCC" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="705" y="172">Set preferences</text>

  <!-- preferences detail -->
  <rect x="350" y="240" width="500" height="110" rx="14" fill="#FBF7EF" stroke="#CCCCCC" stroke-width="2.2" stroke-dasharray="10 7"/>
  <text class="task" x="366" y="266">Preferences (captured on sign-up)</text>
  <rect x="366" y="292" width="108" height="44" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="420" y="318">Buy or Rent</text>
  <rect x="486" y="292" width="108" height="44" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="540" y="318">Location</text>
  <rect x="606" y="292" width="108" height="44" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="660" y="318">Price Range</text>
  <rect x="726" y="292" width="108" height="44" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="780" y="318">Land/Unit size</text>

  <!-- ===== FEED (shared hub) ===== -->
  <rect x="980" y="250" width="180" height="58" rx="10" fill="#fff" stroke="#8a8578" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="1070" y="284">Feed</text>

  <!-- ===== FLOW 1: SEARCH & FILTER ===== -->
  <text class="task" x="1180" y="360">Flow 1 · Search for a property</text>

  <rect x="980" y="360" width="180" height="58" rx="10" fill="#C8E6C9" stroke="#8FAE90" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="1070" y="394">Search by Location</text>
  <rect x="980" y="470" width="180" height="58" rx="10" fill="#fff" stroke="#CCCCCC" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="1070" y="504">Search Results</text>
  <rect x="980" y="580" width="180" height="58" rx="10" fill="#fff" stroke="#CCCCCC" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="1070" y="614">Select Listing</text>
  <rect x="980" y="690" width="180" height="58" rx="10" fill="#fff" stroke="#CCCCCC" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="1070" y="724">View Info</text>

  <!-- filter detail (correctly labelled) -->
  <rect x="1180" y="435" width="322" height="322" rx="14" fill="#FBF7EF" stroke="#CCCCCC" stroke-width="2.2" stroke-dasharray="10 7"/>
  <text class="task" x="1196" y="461">Filter results</text>
  <rect x="1265" y="472" width="150" height="44" rx="9" fill="#C8E6C9" stroke="#8FAE90" stroke-width="2"/>
  <text class="n" text-anchor="middle" x="1340" y="499">Filter</text>
  <rect x="1188" y="540" width="148" height="40" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="1262" y="564">Buy or Rent</text>
  <rect x="1188" y="590" width="148" height="40" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="1262" y="614">Property type</text>
  <rect x="1188" y="640" width="148" height="40" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="1262" y="664">Location</text>
  <rect x="1188" y="690" width="148" height="40" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="1262" y="714">Price Range</text>
  <rect x="1344" y="540" width="148" height="40" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="1418" y="564">Land/Unit size</text>
  <rect x="1344" y="590" width="148" height="40" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="1418" y="614">No. of bedrooms</text>
  <rect x="1344" y="640" width="148" height="40" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="1418" y="664">Availability</text>
  <rect x="1344" y="690" width="148" height="40" rx="9" fill="#fff" stroke="#CCCCCC" stroke-width="2"/>
  <text class="s" text-anchor="middle" x="1418" y="714">Facilities</text>

  <!-- ===== FLOW 2: SAVE & COMPARE ===== -->
  <rect x="650" y="640" width="250" height="432" rx="14" fill="#FBF7EF" stroke="#CCCCCC" stroke-width="2.2" stroke-dasharray="10 7"/>
  <text class="task" x="660" y="632">Flow 2 · Save &amp; compare</text>

  <!-- Save is an action (confirmation pop-up), not a page -> pill shape -->
  <rect x="680" y="686" width="200" height="52" rx="26" fill="#C8E6C9" stroke="#8FAE90" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="780" y="706">Save to Favourites</text>
  <text text-anchor="middle" x="780" y="723" font-size="10" font-weight="600" fill="#3d6b52">action · pop-up</text>

  <rect x="700" y="812" width="180" height="54" rx="10" fill="#C8E6C9" stroke="#8FAE90" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="790" y="844">Favourites</text>

  <rect x="700" y="912" width="180" height="50" rx="10" fill="#fff" stroke="#CCCCCC" stroke-width="2.2"/>
  <text class="s" text-anchor="middle" x="790" y="941">Select 2+ to compare</text>

  <rect x="700" y="1000" width="180" height="54" rx="10" fill="#C8E6C9" stroke="#8FAE90" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="790" y="1032">Compare</text>

  <!-- ===== FLOW 3: CONTACT AGENT ===== -->
  <rect x="950" y="772" width="280" height="200" rx="14" fill="#FBF7EF" stroke="#CCCCCC" stroke-width="2.2" stroke-dasharray="10 7"/>
  <text class="task" text-anchor="end" x="1058" y="764">Flow 3 · Contact agent</text>
  <rect x="980" y="808" width="180" height="56" rx="10" fill="#C8E6C9" stroke="#8FAE90" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="1070" y="841">Send a Message</text>
  <rect x="980" y="900" width="180" height="56" rx="10" fill="#fff" stroke="#CCCCCC" stroke-width="2.2"/>
  <text class="n" text-anchor="middle" x="1070" y="933">Confirmation</text>

  <!-- ============ ARROWS ============ -->
  <!-- onboarding (main) -->
  <path d="M118,110 L150,110" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <path d="M300,110 L340,110 Q350,110 350,100 L350,80 Q350,80 356,80 L380,80" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <path d="M300,110 L340,110 Q350,110 350,120 L350,165 Q350,165 356,165 L380,165" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <path d="M530,165 L620,167" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <!-- Sign In -> Feed -->
  <path d="M530,80 L998,80 Q1010,80 1010,92 L1010,250" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <!-- Set preferences -> Feed -->
  <path d="M790,167 L1118,167 Q1130,167 1130,179 L1130,250" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <!-- Set preferences -> preferences detail -->
  <path d="M705,195 L705,240" stroke="#B9B4A8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- preferences substeps chain -->
  <path d="M474,314 L486,314" stroke="#B9B4A8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M594,314 L606,314" stroke="#B9B4A8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M714,314 L726,314" stroke="#B9B4A8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- search spine (main) -->
  <path d="M1070,308 L1070,360" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <path d="M1070,418 L1070,470" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <path d="M1070,528 L1070,580" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <path d="M1070,638 L1070,690" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>

  <!-- Search Results <-> Filter (refine) -->
  <path d="M1160,494 L1265,494" stroke="#B9B4A8" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- filter -> columns -->
  <path d="M1305,516 L1262,516 Q1262,528 1262,540" stroke="#B9B4A8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1375,516 L1418,516 Q1418,528 1418,540" stroke="#B9B4A8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1262,580 L1262,590" stroke="#B9B4A8" stroke-width="2" fill="none"/>
  <path d="M1262,630 L1262,640" stroke="#B9B4A8" stroke-width="2" fill="none"/>
  <path d="M1262,680 L1262,690" stroke="#B9B4A8" stroke-width="2" fill="none"/>
  <path d="M1418,580 L1418,590" stroke="#B9B4A8" stroke-width="2" fill="none"/>
  <path d="M1418,630 L1418,640" stroke="#B9B4A8" stroke-width="2" fill="none"/>
  <path d="M1418,680 L1418,690" stroke="#B9B4A8" stroke-width="2" fill="none"/>

  <!-- View Info -> Save (action) -->
  <path d="M980,719 L882,714" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <!-- Favourites -> compare sub-flow -->
  <path d="M790,866 L790,912" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <path d="M790,962 L790,1000" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>

  <!-- View Info -> Send a Message (Flow 3) -->
  <path d="M1070,748 L1070,808" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>
  <path d="M1070,864 L1070,900" stroke="#8a8578" stroke-width="3" fill="none" marker-end="url(#arrow-main)"/>

  <!-- From Feed: a trunk that branches to Save (action) and to open Favourites (page) -->
  <path d="M980,279 L915,279 L915,839 L880,839" stroke="#8a8578" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M915,664 L780,664 L780,686" stroke="#8a8578" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text fill="#8a8578" font-size="11" font-weight="600" text-anchor="end" x="898" y="500">open Favourites</text>
</svg>
