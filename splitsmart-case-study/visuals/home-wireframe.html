<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f5f4ef; --ink:#1c1c1c; --line:#2b2b2b;
    --fill:#9a9a9a; --fill-light:#d9d9d6; --track:#e7e6e1; --ph:#cfcec9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#e9e8e3;font-family:'Kalam',cursive;color:var(--ink);}
  .frame{width:1160px;margin:0 auto;background:var(--paper);border:3px solid var(--line);}
  .layout{display:grid;grid-template-columns:180px 1fr;min-height:760px;}
  /* sidebar */
  .side{border-right:2px solid var(--line);padding:22px 16px;}
  .logo{height:20px;width:100px;background:var(--fill-light);border:1.5px solid var(--line);border-radius:4px;margin-bottom:26px;}
  .navi{height:12px;background:var(--track);border-radius:3px;margin:14px 0;}
  .navi.on{background:var(--fill);width:85%;}
  .navi.w1{width:70%}.navi.w2{width:80%}.navi.w3{width:60%}
  /* main */
  .main{padding:20px 30px 30px;}
  .title{font-family:'Gaegu';font-weight:700;font-size:26px;margin:0 0 16px;}
  .divider{height:2px;background:var(--line);margin:0 0 20px;}
  .card{border:2px solid var(--line);border-radius:8px;padding:16px 18px;background:#fbfaf6;}
  .label{font-size:17px;font-weight:700;}
  .sublabel{color:#777;font-size:14px;}
  .ph{background:var(--ph);border-radius:3px;display:inline-block;height:12px;}
  .num{background:var(--fill);border-radius:4px;height:26px;display:block;}
  /* grids */
  .top{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
  .bottom{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
  /* balance card */
  .owe{display:flex;gap:40px;margin-top:16px;}
  .owe .k{font-size:14px;color:#555;}
  /* sparkline */
  .spark{height:60px;margin-top:14px;}
  .spark svg{width:100%;height:100%;}
  /* action queue */
  .queue-label{font-family:'Gaegu';font-weight:700;font-size:18px;margin:2px 0 4px;}
  .qsub{color:#777;font-size:14px;margin-bottom:12px;}
  .qrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:16px;
        border:2px solid var(--line);border-radius:8px;padding:14px 16px;background:#fbfaf6;margin-bottom:12px;}
  .dot{width:32px;height:32px;border-radius:50%;background:var(--fill-light);border:2px solid var(--line);}
  .btn{border:2px solid var(--line);border-radius:6px;padding:8px 22px;font-weight:700;font-size:15px;background:#fff;}
  /* groups bars */
  .grow{display:grid;grid-template-columns:1fr;gap:0;margin:14px 0;}
  .gbar{height:14px;background:var(--track);border:1.5px solid var(--line);border-radius:7px;overflow:hidden;}
  .gbar > i{display:block;height:100%;background:var(--fill);}
  /* history chart */
  .bars{display:flex;align-items:flex-end;gap:12px;height:150px;border-bottom:2px solid var(--line);padding:0 4px;}
  .bars .b{flex:1;background:var(--fill-light);border:1.5px solid var(--line);border-bottom:none;border-radius:4px 4px 0 0;}
</style>
</head>
<body>
  <div class="frame">
    <div class="layout">
      <!-- SIDEBAR -->
      <div class="side">
        <div class="logo"></div>
        <div class="navi on"></div>
        <div class="navi w1"></div>
        <div class="navi w2"></div>
        <div class="navi w3"></div>
      </div>

      <!-- MAIN -->
      <div class="main">
        <div class="title">Home screen</div>
        <div class="divider"></div>

        <!-- TOP: balance (number) + monthly spend (sparkline) -->
        <div class="top">
          <div class="card">
            <div class="label">your balance</div>
            <span class="num" style="width:45%;margin-top:12px;"></span>
            <div class="owe">
              <div>
                <div class="k">you owe</div>
                <span class="ph" style="width:70px;margin-top:6px;"></span>
              </div>
              <div>
                <div class="k">owed to you</div>
                <span class="ph" style="width:70px;margin-top:6px;"></span>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="label">monthly spend</div>
            <span class="num" style="width:38%;margin-top:12px;"></span>
            <div class="spark">
              <svg viewBox="0 0 400 60" preserveAspectRatio="none" fill="none">
                <path d="M0,46 C40,42 70,30 100,28 C130,26 150,38 180,36 C210,34 240,18 280,20 C320,22 360,32 400,26"
                      stroke="#9a9a9a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- ACTION QUEUE -->
        <div class="queue-label">what needs doing</div>
        <div class="qsub">the few actions waiting on you</div>
        <div class="qrow">
          <span class="dot"></span>
          <span class="ph" style="width:55%"></span>
          <span class="btn">[ action ]</span>
        </div>
        <div class="qrow">
          <span class="dot"></span>
          <span class="ph" style="width:48%"></span>
          <span class="btn">[ action ]</span>
        </div>

        <!-- BOTTOM: groups + spending over time -->
        <div class="bottom">
          <div class="card">
            <div class="label">groups</div>
            <div class="sublabel">budget used per group</div>
            <div class="grow"><span class="gbar"><i style="width:72%"></i></span></div>
            <div class="grow"><span class="gbar"><i style="width:54%"></i></span></div>
            <div class="grow"><span class="gbar"><i style="width:33%"></i></span></div>
          </div>
          <div class="card">
            <div class="label">spending over time</div>
            <div class="sublabel">month by month</div>
            <div class="bars" style="margin-top:14px;">
              <div class="b" style="height:48%"></div>
              <div class="b" style="height:66%"></div>
              <div class="b" style="height:40%"></div>
              <div class="b" style="height:82%"></div>
              <div class="b" style="height:58%"></div>
              <div class="b" style="height:74%"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
